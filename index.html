<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Loups de Zikel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Lumières des bougies -->
<div class="candle-glow candle-left"></div>

<div class="candle-glow candle-right-1"></div>
<div class="candle-glow candle-right-2"></div>
<div class="candle-glow candle-right-3"></div>

<div id="book-trigger"></div>

<div id="scene-blur"></div>

<div id="scene-transition"></div>

<div id="book-close-area"></div>

<div id="dust-particles"></div>

<div id="book">

    <img
    id="cover"
    class="page"
    src="assets/images/cover.png"
    alt="Couverture"
>

<!-- Première double page -->

<img
    id="page1-left"
    class="page hidden"
    src="assets/images/page01-left.png"
    alt="Première page gauche"
>

<img
    id="page1-right"
    class="page hidden"
    src="assets/images/page01-right.png"
    alt="Première page droite"
>

<!-- Deuxième double page -->

<img
    id="page2-left"
    class="page hidden"
    src="assets/images/page02-left.png"
    alt="Deuxième page gauche"
>

<img
    id="page2-right"
    class="page hidden"
    src="assets/images/page02-right.png"
    alt="Deuxième page droite"
>

<div id="previousPage"></div>
<div id="nextPage"></div>

<!-- Troisième double page -->

<img
    id="page3-left"
    class="page hidden"
    src="assets/images/page03-left.png"
    alt="Troisième page gauche"
>

<img
    id="page3-right"
    class="page hidden"
    src="assets/images/page03-right.png"
    alt="Troisième page droite"
>

</div>

<script src="script.js"></script> 
</body>
</html>
